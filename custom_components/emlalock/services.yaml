add_time:
  name: Add time
  description: Add time to the EmlaLock timer.
  fields:
    entry_id:
      name: Entry ID
      description: Home Assistant config entry ID for the EmlaLock lock.
      required: true
      selector:
        text:
    value:
      name: Value
      description: Time in seconds or an EmlaLock short-term value such as W1, D1, H1, M1, or S30.
      required: true
      selector:
        text:
    text:
      name: Text
      description: Optional display text sent with the add action.
      required: false
      selector:
        text:

subtract_time:
  name: Subtract time
  description: Subtract time from the EmlaLock timer.
  fields:
    entry_id:
      name: Entry ID
      required: true
      selector:
        text:
    value:
      name: Value
      required: true
      selector:
        text:
    text:
      name: Text
      required: false
      selector:
        text:

add_maximum:
  name: Add maximum
  description: Add to the EmlaLock maximum value.
  fields:
    entry_id:
      name: Entry ID
      required: true
      selector:
        text:
    value:
      name: Value
      required: true
      selector:
